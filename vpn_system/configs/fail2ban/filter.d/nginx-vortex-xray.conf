[INCLUDES]
before = common.conf

[Definition]
# Basic protection for Xray behind Nginx.
# Xray listens on 127.0.0.1, so Xray logs usually only show localhost.
# We instead ban clients that trigger excessive 4xx/5xx on the public Nginx access log.
#
# Expected access log format (common):
# <ip> - - [date] "GET /path HTTP/1.1" 404 <bytes> "ref" "ua" ...
#
# Note: This filter intentionally matches broadly; tune maxretry/findtime in jail.local.
failregex = ^<HOST>\s+-\s+-\s+\[[^\]]+\]\s+"[^"]*"\s+(?:400|401|403|404|405|408|429|444|495|496|497|499|500|502|503|504)\s+\d+\b

# Never ban ACME validation traffic
ignoreregex = ^<HOST>\s+-\s+-\s+\[[^\]]+\]\s+"\S+\s+/\.well-known/acme-challenge/\S+\s+HTTP/\d\.\d"\s+
